# Colmena hosted, Phase 1 (docs/CLOUD.md): the Worker serves the built UI, signs people in
# (Directory DO) and runs each company's server in its own Workspace DO (SQLite, EU).
# Build first: `npm run build` at the repository root (the UI into ../dist), then here
# `npm run assets` (prompts bundled as text). Local: `npm run dev`; deploy: `npm run deploy`.
# Secrets (never in this file): WORKSPACE_KEYS, VAULT_MASTER_KEY, ADMIN_BOOTSTRAP_TOKEN and,
# when there is a mail provider, RESEND_API_KEY. Locally they come from ../.local/cloud.env.
name = "colmena-nube"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
# The app lives at app.colmena.team (workers.dev stays on for tests).
routes = [{ pattern = "app.colmena.team", custom_domain = true }]


[vars]
# Workspaces and the directory live in the EU: the jurisdiction is chosen per namespace at
# runtime (env.WORKSPACE.jurisdiction("eu")); wrangler.toml has no field for it. workerd does
# not implement jurisdictions, so `npm run dev` clears it (--var JURISDICTION:).
JURISDICTION = "eu"
# Real mail (cloud/src/mail.js): Cloudflare Email Sending once the account has a sending domain
# (a [[send_email]] binding named SEND_EMAIL plus MAIL_FROM_ADDRESS on that domain), or Resend
# (secret RESEND_API_KEY, sender MAIL_FROM). With neither, the dev fallback.
MAIL_FROM = "Colmena <onboarding@resend.dev>"
# The sending domain colmena.team (Email Sending enabled, DKIM/SPF/DMARC records on the zone).
MAIL_FROM_ADDRESS = "acceso@colmena.team"
# Links in mails sent from a workspace's alarm (the digest of unread mentions) need the site.
PUBLIC_URL = "https://app.colmena.team"
# Web Push (server/cloud/webpush.mjs): the VAPID pair is the secrets VAPID_PUBLIC_KEY and
# VAPID_PRIVATE_KEY (cloud/scripts/vapid-keys.mjs); this is who push services may contact.
VAPID_SUBJECT = "https://app.colmena.team"
# Phase 4 (docs/CLOUD.md): each company's machine (a container behind the Machine DO) sleeps after
# this many quiet seconds, may run this many minutes a month, and has this size.
MACHINE_SLEEP_AFTER_S = "600"
MACHINE_MINUTES_PER_MONTH = "600"
MACHINE_INSTANCE = "standard-1"
# The Machine DOs live in the EU like the workspaces (containers are placed in the EU too).
MACHINE_JURISDICTION = "eu"

[[send_email]]
name = "SEND_EMAIL"

[assets]
directory = "../dist"
binding = "ASSETS"
# Every request goes through the Worker first: it decides who sees the app.
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "WORKSPACE"
class_name = "Workspace"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# Mission files of every workspace (server/file-store.mjs › R2Files), under workspaces/<id>/.
# Without this binding (wrangler dev) files stay in each workspace's own SQLite.
[[r2_buckets]]
binding = "FILES"
bucket_name = "colmena-nube-files"
jurisdiction = "eu"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Workspace"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

# Phase 4: one machine (container) per company, started on demand and stopped when idle
# (cloud/src/machine.js, the Durable Object Container API). The image is built from the
# repository root: cloud/container/Dockerfile (+ Dockerfile.dockerignore). DO-managed containers take
# no placement constraints: the container runs beside its Machine DO (EU jurisdiction).
[[durable_objects.bindings]]
name = "MACHINE"
class_name = "Machine"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Machine"]

[[containers]]
class_name = "Machine"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./container/Dockerfile"
build_context = ".."

# The bots' browser (server/cloud/browser-cloud.mjs): Cloudflare Browser Rendering.
[browser]
binding = "BROWSER"

[observability]
enabled = false
