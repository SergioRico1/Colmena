<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Barra lateral de Colmena</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Navegación de Colmena" style="position: relative; box-sizing: border-box; width: 248px; height: 100vh; min-height: 560px; display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 12px; background: #ECECE7; border-right: 1px solid rgba(18,19,26,.07); font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #12131A; -webkit-font-smoothing: antialiased">

<div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 24px; padding: 0 4px">
<span aria-hidden="true" style="display: flex; gap: 6px"><span style="width: 11px; height: 11px; border-radius: 50%; background: rgba(18,19,26,.14)"></span><span style="width: 11px; height: 11px; border-radius: 50%; background: rgba(18,19,26,.14)"></span><span style="width: 11px; height: 11px; border-radius: 50%; background: rgba(18,19,26,.14)"></span></span>
<button type="button" aria-label="Plegar la barra (Ctrl B)" title="Plegar la barra (Ctrl B)" style="width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #4A4D57; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"></rect><path d="M9.5 4.5v15"></path></svg></button>
</div>

<a href="Main.dc.html" style="flex: none; display: flex; align-items: center; gap: 10px; padding: 0 6px; color: #12131A; text-decoration: none">
<img src="/colmena-icon-128.png" alt="" width="28" height="28" style="display: block; width: 28px; height: 28px; filter: drop-shadow(0 2px 4px rgba(201,120,0,.35))">
<span style="font: 600 20px/1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.03em">Colmena</span>
</a>

<div style="flex: none; position: relative; z-index: 5; display: flex; flex-direction: column; gap: 8px">
<button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-haspopup="menu" style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; border: 0; border-radius: 12px; background: #12131A; color: #FFFFFF; font-size: 14.5px; font-weight: 600; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span style="flex: 1; text-align: left">Nuevo</span>
<kbd style="font: 500 11px/1 'Geist Mono', monospace; color: #A9ACB6">Ctrl N</kbd>
</button>
<a href="Buscar.dc.html" style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 12px; background: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(18,19,26,.08); color: #5C606C; font-size: 14px; text-decoration: none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 17.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM20 20l-4.2-4.2"></path></svg>
<span style="flex: 1">Buscar o pedir</span>
<kbd style="font: 500 11px/1 'Geist Mono', monospace; color: #5C606C">Ctrl K</kbd>
</a>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="Crear algo nuevo" style="position: absolute; top: 46px; left: 0; right: -6px; display: flex; flex-direction: column; padding: 6px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(18,19,26,.06), 0 24px 48px -16px rgba(18,19,26,.35)">
<sc-for list="{{newItems}}" as="n" hint-placeholder-count="7">
<a role="menuitem" href="{{n.href}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 10px; border-radius: 10px; color: #12131A; text-decoration: none">
<span aria-hidden="true" style="flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: #F1F1EC"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 14px; font-weight: 600">{{n.label}}</span><span style="font-size: 12px; color: #5C606C">{{n.hint}}</span></span>
</a>
</sc-for>
</div>
</sc-if>
</div>

<div style="flex: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="i" hint-placeholder-count="6">
<a href="{{i.href}}" aria-current="{{i.current}}" style="height: 36px; display: flex; align-items: center; gap: 11px; padding: 0 10px; border-radius: 10px; text-decoration: none; color: {{i.color}}; background: {{i.bg}}; box-shadow: {{i.shadow}}; font-size: 14.5px; font-weight: {{i.weight}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>
<span style="flex: 1">{{i.label}}</span>
<sc-if value="{{i.badge}}" hint-placeholder-val="{{ false }}"><span aria-label="{{i.badgeLabel}}" style="min-width: 20px; height: 20px; padding: 0 6px; display: grid; place-items: center; border-radius: 10px; background: {{i.badgeBg}}; color: {{i.badgeInk}}; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums">{{i.badge}}</span></sc-if>
<sc-if value="{{i.showKey}}" hint-placeholder-val="{{ false }}"><kbd style="font: 500 11px/1 'Geist Mono', monospace; color: #5C606C">{{i.key}}</kbd></sc-if>
</a>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 1px; margin: 0 -4px; padding: 2px 4px; overflow-y: auto">
<span style="padding: 8px 10px 4px; font-size: 12px; font-weight: 600; color: #5C606C">Fijados</span>
<sc-for list="{{pinned}}" as="p" hint-placeholder-count="3">
<a href="{{p.href}}" style="flex: none; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 9px; color: #3D404A; font-size: 14px; text-decoration: none">
<span aria-hidden="true" style="flex: none; width: 18px; height: 18px; display: grid; place-items: center; color: #5C606C"><span style="width: {{p.size}}; height: {{p.size}}; display: grid; place-items: center; background: {{p.color}}; clip-path: {{p.clip}}; border-radius: {{p.radius}}; font: 600 {{p.fs}}/1 'Geist', sans-serif; color: #3D404A">{{p.text}}</span></span>
<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.label}}</span>
<sc-if value="{{p.unread}}" hint-placeholder-val="{{ false }}"><span aria-label="Sin leer" style="width: 7px; height: 7px; border-radius: 50%; background: #12131A"></span></sc-if>
</a>
</sc-for>
<span style="padding: 12px 10px 4px; font-size: 12px; font-weight: 600; color: #5C606C">Recientes</span>
<sc-for list="{{recent}}" as="p" hint-placeholder-count="4">
<a href="{{p.href}}" style="flex: none; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 9px; color: #3D404A; font-size: 14px; text-decoration: none">
<span aria-hidden="true" style="flex: none; width: 18px; height: 18px; display: grid; place-items: center; color: #5C606C"><span style="width: {{p.size}}; height: {{p.size}}; display: grid; place-items: center; background: {{p.color}}; clip-path: {{p.clip}}; border-radius: {{p.radius}}; font: 600 {{p.fs}}/1 'Geist', sans-serif; color: #3D404A">{{p.text}}</span></span>
<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.label}}</span>
</a>
</sc-for>
</div>

<a href="Actividad.dc.html" aria-current="{{actCurrent}}" style="flex: none; display: flex; flex-direction: column; gap: 7px; padding: 11px 12px; border-radius: 14px; background: {{actBg}}; box-shadow: inset 0 0 0 1px rgba(18,19,26,.07); color: #12131A; text-decoration: none">
<span style="display: flex; align-items: center; gap: 6px">
<span aria-hidden="true" style="width: 13px; height: 13px; background: #12131A; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); animation: breathe 2.6s ease-in-out infinite"></span>
<span aria-hidden="true" style="width: 13px; height: 13px; background: #0B8A5F; border-radius: 24%; animation: breathe 2.2s ease-in-out infinite"></span>
<span aria-hidden="true" style="flex: none; width: 19px; height: 19px; margin: -3px -1px; display: grid; place-items: center; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #FFC93C"><span style="width: 11px; height: 11px; background: #FF5CA8; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></span></span>
<span aria-hidden="true" style="width: 13px; height: 13px; background: #7B4DFF; border-radius: 50% 12% 50% 12%; animation: breathe 2.4s ease-in-out infinite"></span>
<span aria-hidden="true" style="width: 13px; height: 13px; background: #2F6BFF; border-radius: 50%; opacity: .4"></span>
<span aria-hidden="true" style="width: 13px; height: 13px; background: #FF7A1A; border-radius: 50% 50% 14% 14%; opacity: .4"></span>
<span style="margin-left: auto; font-size: 12px; color: #5C606C">Actividad</span>
</span>
<span style="font-size: 13.5px; font-weight: 600">3 trabajando · 1 te espera</span>
<span style="font-size: 12.5px; color: #5C606C">{{actLine}}</span>
</a>

<div style="flex: none; display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid rgba(18,19,26,.08)">
<a href="Ajustes.dc.html" aria-current="{{setCurrent}}" style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 12px; background: {{setBg}}; color: #12131A; text-decoration: none">
<span aria-hidden="true" style="flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: #E6E7EC; color: #12131A; font-size: 11px; font-weight: 600">SR</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 14px; font-weight: 600">Sergio Rico</span><span style="font-size: 12px; color: #5C606C">Ajustes y cuenta</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4D57" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 4.5v5M10 14.5v5"></path></svg>
</a>
<button type="button" role="switch" aria-checked="{{experto}}" onClick="{{toggleExperto}}" style="height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 10px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-size: 13.5px; font-weight: 500; color: #3D404A">
<span style="flex: 1; text-align: left">Modo experto</span>
<sc-if value="{{experto}}" hint-placeholder-val="{{ false }}"><kbd style="font: 500 10.5px/1 'Geist Mono', monospace; color: #5C606C">Ctrl ⇧ E</kbd></sc-if>
<span aria-hidden="true" style="position: relative; flex: none; width: 34px; height: 20px; border-radius: 10px; background: {{swBg}}; transition: background .2s ease"><span style="position: absolute; top: 2px; left: {{swLeft}}; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(18,19,26,.3); transition: left .2s ease"></span></span>
</button>
</div>

<style>@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@media (prefers-reduced-motion: reduce){nav *{animation:none!important;transition:none!important}}</style>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","chats","trabajo","codigo","equipo","biblioteca","actividad","ajustes"],"default":"inicio"},"experto":{"editor":"boolean","default":false},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menu: false, experto: null }; }
  renderVals() {
    const active = this.props.active ?? 'inicio';
    const experto = this.state.experto ?? (this.props.experto === true || this.props.experto === 'true');
    const HEX = 'polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%)';
    const items = [
      { id: 'inicio', label: 'Inicio', href: 'Inicio.dc.html', key: 'Ctrl 1', icon: 'M3.5 10.5 12 4l8.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5A1.5 1.5 0 0 1 3.5 19z', badge: '3', badgeLabel: '3 cosas te necesitan', honey: true },
      { id: 'chats', label: 'Chats', href: 'Chats.dc.html', key: 'Ctrl 2', icon: 'M4.5 6.5A2.5 2.5 0 0 1 7 4h10a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 17 16h-6.5L6 19.5V16a2.5 2.5 0 0 1-1.5-2.3z', badge: '2', badgeLabel: '2 chats sin leer' },
      { id: 'trabajo', label: 'Trabajo', href: 'Tareas.dc.html', key: 'Ctrl 3', icon: 'M10 6h10M10 12h10M10 18h10M4 6l1.3 1.3L7.8 4.8M4 12l1.3 1.3 2.5-2.5M4 18l1.3 1.3 2.5-2.5' },
      { id: 'codigo', label: 'Código', href: 'Codigo.dc.html', key: 'Ctrl 4', icon: 'm18 16 4-4-4-4M6 8l-4 4 4 4M14.5 4l-5 16' },
      { id: 'equipo', label: 'Equipo', href: 'Equipo.dc.html', key: 'Ctrl 5', icon: 'M8 3.8h8l4 8.2-4 8.2H8l-4-8.2zM12 9.3l2.3 1.35v2.7L12 14.7l-2.3-1.35v-2.7z' },
      { id: 'biblioteca', label: 'Biblioteca', href: 'Archivos.dc.html', key: 'Ctrl 6', icon: 'M4 4.5h3.5v15H4zM9.5 4.5H13v15H9.5zM15 5.5l3.2-1 3.3 14-3.2 1z' }
    ];
    const nav = items.map((i) => {
      const on = i.id === active;
      return { ...i, current: on ? 'page' : undefined, bg: on ? '#FFFFFF' : 'transparent', color: on ? '#12131A' : '#3D404A', weight: on ? '600' : '500', shadow: on ? '0 1px 2px rgba(18,19,26,.08), 0 6px 14px -8px rgba(18,19,26,.3)' : 'none', badge: i.badge || false, badgeBg: i.honey ? '#FFC93C' : '#12131A', badgeInk: i.honey ? '#12131A' : '#FFFFFF', showKey: experto && !i.badge };
    });
    const g = (o) => ({ size: '14px', fs: '12px', color: 'transparent', clip: 'none', radius: '0', text: '', unread: false, ...o });
    return {
      nav,
      experto,
      menuOpen: this.state.menu,
      toggleMenu: () => this.setState({ menu: !this.state.menu }),
      toggleExperto: () => this.setState({ experto: !experto }),
      swBg: experto ? '#12131A' : '#8A8D96',
      swLeft: experto ? '16px' : '2px',
      actCurrent: active === 'actividad' ? 'page' : undefined,
      actBg: active === 'actividad' ? '#FFFFFF' : 'rgba(255,255,255,.55)',
      actLine: experto ? '1,84 € hoy · caché 58 %' : 'Iris espera tu decisión',
      setCurrent: active === 'ajustes' ? 'page' : undefined,
      setBg: active === 'ajustes' ? '#FFFFFF' : 'transparent',
      newItems: [
        { label: 'Chat con un bot', hint: 'Pregunta o encarga algo', href: 'Chat.dc.html', icon: 'M4.5 6.5A2.5 2.5 0 0 1 7 4h10a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 17 16h-6.5L6 19.5V16a2.5 2.5 0 0 1-1.5-2.3z' },
        { label: 'Sala', hint: 'Con personas y varios bots', href: 'Sala.dc.html', icon: 'M5 9h14M5 15h14M10 4 8 20M16 4l-2 16' },
        { label: 'Tarea', hint: 'Un trabajo con plan y entrega', href: 'Tareas.dc.html', icon: 'M5 12.5l4 4 10-10' },
        { label: 'Rutina', hint: 'Algo que se repite solo', href: 'Rutinas.dc.html', icon: 'M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.8 4.5v3.6h-3.6' },
        { label: 'Objetivo', hint: 'Una meta a largo plazo', href: 'Objetivos.dc.html', icon: 'M12 20.5a8.5 8.5 0 1 0 0-17 8.5 8.5 0 0 0 0 17zM12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z' },
        { label: 'Bot', hint: 'Un compañero nuevo', href: 'NuevoBot.dc.html', icon: 'M8 3.8h8l4 8.2-4 8.2H8l-4-8.2z' },
        { label: 'Tarea de código', hint: 'En uno de tus proyectos', href: 'Codigo.dc.html', icon: 'm18 16 4-4-4-4M6 8l-4 4 4 4' }
      ],
      pinned: [
        g({ label: 'informe-q3', href: 'Sala.dc.html', text: '#', fs: '14px', unread: true }),
        g({ label: 'Vera', href: 'Chat.dc.html', color: '#7B4DFF', radius: '50% 12% 50% 12%' }),
        g({ label: 'tienda-web', href: 'CodigoTarea.dc.html', text: '</>', size: '18px', fs: '9.5px' })
      ],
      recent: [
        g({ label: 'Campaña de primavera', href: 'Tarea.dc.html', text: '✓', size: '16px', fs: '10px', color: '#DCDCD5', radius: '5px' }),
        g({ label: 'Marta Ruiz', href: 'Personas.dc.html', color: '#DCDCD5', radius: '50%', text: 'MR', size: '18px', fs: '7.5px' }),
        g({ label: 'Tres ideas para la portada', href: 'Propuestas.dc.html', text: '◇', size: '16px', fs: '12px' }),
        g({ label: 'Tomás', href: 'Chat.dc.html', color: '#0B8A5F', radius: '24%' }),
        g({ label: 'Atlas', href: 'Chat.dc.html', color: '#12131A', clip: HEX })
      ]
    };
  }
}
</script>
</body>
</html>
