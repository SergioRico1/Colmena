<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscar o pedir</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F5F2;font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:#12131A;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#1F4FD1;text-decoration:none}a:hover{color:#12131A}
:focus-visible{outline:2px solid #1F4FD1;outline-offset:2px}
::placeholder{color:#6B6F7A}
@keyframes sheet{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; display: flex; flex-wrap: wrap; min-height: 100vh; background: #F5F5F2; color: #12131A">
<div style="flex: 0 0 248px; position: relative"><div style="position: sticky; top: 0; height: 100vh"><dc-import name="V3Barra" active="inicio" hint-size="248px,100vh"></dc-import></div></div>
<div aria-hidden="true" style="flex: 999 1 560px; min-width: 0; padding: 44px 52px; display: flex; flex-direction: column; gap: 28px">
<span style="height: 60px; width: 60%; border-radius: 14px; background: #E8E8E3"></span>
<span style="height: 84px; border-radius: 28px; background: #FFFFFF"></span>
<span style="height: 160px; border-radius: 24px; background: #FFFFFF"></span>
</div>

<div style="position: absolute; z-index: 50; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding: 72px 24px 24px; background: rgba(18,19,26,.38)">
<div role="dialog" aria-modal="true" aria-label="Buscar o pedir" style="width: 100%; max-width: 920px; display: flex; flex-direction: column; border-radius: 26px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(18,19,26,.08), 0 40px 90px -30px rgba(18,19,26,.6); overflow: hidden; animation: sheet .25s ease-out">

<div style="display: flex; align-items: center; gap: 14px; padding: 0 22px; height: 70px; border-bottom: 1px solid rgba(18,19,26,.07)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A4D57" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M11 17.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13zM20 20l-4.2-4.2"></path></svg>
<label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar o pedir</span><input type="text" value="facturas" placeholder="Busca chats, tareas, archivos, bots, ajustes… o pide algo" style="flex: 1; min-width: 0; height: 48px; border: 0; outline: none; background: transparent; font-size: 20px"></label>
<kbd style="padding: 5px 8px; border-radius: 7px; background: #F1F1EC; font: 500 12px/1 'Geist Mono', monospace; color: #4A4D57">Esc</kbd>
</div>

<div role="tablist" aria-label="Qué buscar" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 22px; border-bottom: 1px solid rgba(18,19,26,.07)">
<sc-for list="{{scopes}}" as="s" hint-placeholder-count="7"><button type="button" role="tab" aria-selected="{{s.on}}" onClick="{{s.pick}}" style="height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: {{s.bg}}; color: {{s.ink}}; font-size: 13.5px; font-weight: 500; cursor: pointer">{{s.label}}<span style="font-size: 12px; opacity: .75">{{s.n}}</span></button></sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; min-height: 460px">
<div role="listbox" aria-label="Resultados" style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 10px; max-height: 520px; overflow: auto">

<button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border: 0; border-radius: 12px; background: transparent; box-shadow: inset 0 0 0 1px rgba(18,19,26,.1); color: #12131A; text-align: left; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: #12131A"><span style="width: 14px; height: 14px; background: #FFFFFF; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%)"></span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 600">Pedir «facturas» a tu equipo</span><span style="font-size: 12.5px; color: #5C606C">Atlas decide quién lo hace · probablemente Bruno</span></span>
<kbd style="font: 500 11.5px/1 'Geist Mono', monospace; color: #5C606C">Ctrl Intro</kbd>
</button>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<span style="padding: 12px 12px 4px; font-size: 12px; font-weight: 600; color: #5C606C">{{g.title}}</span>
<sc-for list="{{g.items}}" as="r" hint-placeholder-count="2">
<button type="button" role="option" aria-selected="{{r.on}}" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 12px; border: 0; border-radius: 12px; background: {{r.bg}}; text-align: left; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: #F1F1EC; font-size: 12px; font-weight: 600; color: #3D404A"><span style="width: {{r.size}}; height: {{r.size}}; display: grid; place-items: center; background: {{r.color}}; clip-path: {{r.clip}}; border-radius: {{r.radius}}">{{r.glyph}}</span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 500">{{r.title}}</span><span style="font-size: 12.5px; color: #5C606C; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.meta}}</span></span>
</button>
</sc-for>
</sc-for>
</div>

<aside aria-label="Vista previa" style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 22px; background: #F6F6F3; border-left: 1px solid rgba(18,19,26,.06)">
<span style="font-size: 12px; font-weight: 600; color: #5C606C">{{cur.kind}}</span>
<h2 style="margin: 0; font: 600 22px/1.15 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em">{{cur.title}}</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4A4D57">{{cur.desc}}</p>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: #FFFFFF; font-size: 13.5px">
<sc-for list="{{cur.facts}}" as="f" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: #5C606C">{{f.k}}</span><span style="font-weight: 500; text-align: right">{{f.v}}</span></div></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><a href="{{cur.href}}" style="height: 40px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 999px; background: #12131A; color: #FFFFFF; font-size: 14px; font-weight: 600">{{cur.cta}}</a></div>
</aside>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 12px 22px; border-top: 1px solid rgba(18,19,26,.07); font-size: 12.5px; color: #5C606C">
<span><kbd style="font: 500 11.5px/1 'Geist Mono', monospace; color: #12131A">↑ ↓</kbd> moverse</span>
<span><kbd style="font: 500 11.5px/1 'Geist Mono', monospace; color: #12131A">Intro</kbd> abrir</span>
<span><kbd style="font: 500 11.5px/1 'Geist Mono', monospace; color: #12131A">Ctrl Intro</kbd> pedirlo al equipo</span>
<span><kbd style="font: 500 11.5px/1 'Geist Mono', monospace; color: #12131A">&gt;</kbd> solo comandos</span>
<span><kbd style="font: 500 11.5px/1 'Geist Mono', monospace; color: #12131A">@</kbd> un bot o persona</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'xlsx', scope: 'todo' }; }
  renderVals() {
    const st = this.state;
    const base = { size: '16px', color: 'transparent', clip: 'none', radius: '0', glyph: '' };
    const all = [
      { g: 'Chats', id: 'sala', ...base, glyph: '#', title: '# facturación', meta: 'Bruno: 12 facturas registradas · lun', kind: 'Sala', desc: 'Sala con Marta, Luis, Bruno y Atlas para las facturas de la empresa.', facts: [{ k: 'Personas', v: '3' }, { k: 'Bots', v: 'Bruno, Atlas' }, { k: 'Último mensaje', v: 'lunes 18:02' }], cta: 'Abrir la sala', href: 'Sala.dc.html' },
      { g: 'Tareas', id: 'tarea', ...base, glyph: '✓', title: 'Registrar facturas de octubre', meta: 'Bruno · hecha ayer', kind: 'Tarea · hecha', desc: 'Bruno leyó 58 facturas del correo y las apuntó en la hoja de gastos. Dos pasaban de 500 € y las aprobaste.', facts: [{ k: 'Lo hizo', v: 'Bruno' }, { k: 'Tiempo', v: '14 min' }, { k: 'Entregó', v: 'facturas_octubre.xlsx' }], cta: 'Abrir la tarea', href: 'Tarea.dc.html' },
      { g: 'Archivos', id: 'xlsx', ...base, glyph: 'XLS', size: '26px', title: 'facturas_octubre.xlsx', meta: 'Hoja · Bruno · ayer', kind: 'Archivo · hoja de cálculo', desc: '58 facturas de proveedores con importe, IVA, vencimiento y estado de pago.', facts: [{ k: 'Lo hizo', v: 'Bruno' }, { k: 'Versiones', v: '3' }, { k: 'Dónde', v: 'Biblioteca › Archivos' }], cta: 'Abrir el archivo', href: 'Archivos.dc.html' },
      { g: 'Bots', id: 'bruno', ...base, color: '#FF7A1A', radius: '50% 50% 14% 14%', title: 'Bruno', meta: 'Facturas y pagos · libre', kind: 'Bot', desc: 'Registra facturas, controla los pagos y te avisa de lo que vence. Antes de pagar, siempre te pregunta.', facts: [{ k: 'Autonomía', v: 'Hace y te avisa' }, { k: 'Apps', v: 'Correo, Hojas' }, { k: 'Este mes', v: '3,10 €' }], cta: 'Hablar con Bruno', href: 'Chat.dc.html' },
      { g: 'Rutinas', id: 'rutina', ...base, glyph: '↻', title: 'Cada lunes, Bruno revisa las facturas que vencen', meta: 'Rutina · activa · próxima lun 9:00', kind: 'Rutina', desc: 'Te deja en Inicio la lista de pagos de la semana y avisa si alguno pasa de 500 €.', facts: [{ k: 'Cuándo', v: 'Lunes 9:00' }, { k: 'Última vez', v: 'hace 2 días' }, { k: 'Resultado', v: 'En Inicio' }], cta: 'Ver la rutina', href: 'Rutinas.dc.html' },
      { g: 'Ajustes', id: 'ajuste', ...base, glyph: '⚙', title: 'Pagos: pedir permiso desde 0 €', meta: 'Ajustes › Permisos y autonomía', kind: 'Ajuste', desc: 'Mover dinero es una línea roja: siempre te preguntan, sea cual sea el importe.', facts: [{ k: 'Sección', v: 'Permisos y autonomía' }, { k: 'Valor', v: 'Siempre preguntar' }], cta: 'Ir al ajuste', href: 'Permisos.dc.html' },
      { g: 'Comandos', id: 'cmd', ...base, glyph: '>', title: 'Nueva rutina de facturas…', meta: 'Comando', kind: 'Comando', desc: 'Abre el creador de rutinas con Bruno y «facturas» ya puestos.', facts: [{ k: 'Atajo', v: '> rutina' }], cta: 'Ejecutar', href: 'Rutinas.dc.html' }
    ];
    const order = ['Chats', 'Tareas', 'Archivos', 'Bots', 'Rutinas', 'Ajustes', 'Comandos'];
    const scopeMap = { todo: null, chats: 'Chats', tareas: 'Tareas', archivos: 'Archivos', bots: 'Bots', ajustes: 'Ajustes', comandos: 'Comandos' };
    const want = scopeMap[st.scope];
    const groups = order.filter((g) => !want || g === want).map((g) => ({ title: g, items: all.filter((r) => r.g === g).map((r) => ({ ...r, on: r.id === st.sel, bg: r.id === st.sel ? '#F1F1EC' : 'transparent', pick: () => this.setState({ sel: r.id }) })) }));
    const scopes = [['todo', 'Todo', '7'], ['chats', 'Chats', '1'], ['tareas', 'Tareas', '1'], ['archivos', 'Archivos', '1'], ['bots', 'Bots', '1'], ['ajustes', 'Ajustes', '1'], ['comandos', 'Comandos', '1']].map(([id, label, n]) => ({ label, n, on: st.scope === id, bg: st.scope === id ? '#12131A' : '#F1F1EC', ink: st.scope === id ? '#FFFFFF' : '#3D404A', pick: () => this.setState({ scope: id }) }));
    return { groups, scopes, cur: all.find((r) => r.id === st.sel) || all[2] };
  }
}
</script>
</body>
</html>
