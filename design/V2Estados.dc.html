<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Colmena v2 · Estados de la app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&amp;family=Geist:wght@300;400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F5F2;font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:#12131A;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #1F4FD1;outline-offset:3px}
::placeholder{color:#8A8D96}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes beckon{0%{filter:drop-shadow(0 0 0 rgba(255,201,60,.95))}100%{filter:drop-shadow(0 0 14px rgba(255,201,60,0))}}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(255,201,60,.55)}100%{box-shadow:0 0 0 14px rgba(255,201,60,0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes develop{from{filter:blur(18px) saturate(.4);transform:scale(1.04)}to{filter:blur(0) saturate(1);transform:none}}
.msg{border-radius:16px;margin-left:-12px!important;margin-right:-12px!important;padding-left:12px!important;padding-right:12px!important;transition:background .15s ease}
.msg:hover,.msg:focus-within{background:rgba(18,19,26,.028)}
.msg .msg-tools{opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .15s ease,transform .15s ease}
.msg:hover .msg-tools,.msg:focus-within .msg-tools{opacity:1;transform:none;pointer-events:auto}
@media (max-width: 760px){[data-convlist]{display:none!important}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; min-height: 1450px; background: #F5F5F2; padding-bottom: 0px">
<main style="max-width: 1320px; margin: 0 auto; padding: 72px clamp(20px, 4vw, 56px) 80px; display: flex; flex-direction: column; gap: 44px">

<header style="display: flex; flex-direction: column; gap: 16px; max-width: 760px">
<span style="font: 500 14px/1 'Geist Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #8A8D96">Colmena 2.0 · estados de la app</span>
<h1 style="margin: 0; font: 600 clamp(44px, 6vw, 76px)/0.95 'Bricolage Grotesque', sans-serif; letter-spacing: -0.05em">Cuando algo no está listo.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #3D404A">Colmena funciona en tu ordenador. Al arrancar, si se pierde la conexión con su servicio o si una pantalla no existe, la app lo dice con calma, explica qué pasa y ofrece una salida. Nunca una ventana en blanco.</p>
</header>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(580px, 100%), 1fr)); gap: 28px">

<figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<div style="position: relative; height: 420px; border-radius: 22px; overflow: hidden; background: #F5F5F2; box-shadow: 0 30px 70px -36px rgba(18,19,26,.4), 0 0 0 1px rgba(18,19,26,.06)">
<span aria-hidden="true" style="position: absolute; left: 16px; top: 14px; display: flex; gap: 6px"><span style="width: 11px; height: 11px; border-radius: 50%; background: rgba(18,19,26,.14)"></span><span style="width: 11px; height: 11px; border-radius: 50%; background: rgba(18,19,26,.14)"></span><span style="width: 11px; height: 11px; border-radius: 50%; background: rgba(18,19,26,.14)"></span></span>
<sc-if value="{{boot.loading}}" hint-placeholder-val="{{ true }}">
<div role="status" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; animation: fade .4s ease-out">
<img src="colmena-icon.png" alt="" width="96" height="96" style="display: block; width: 96px; height: 96px; filter: drop-shadow(0 12px 30px rgba(201,120,0,.35)); animation: breathe 2.6s ease-in-out infinite">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><strong style="font: 600 24px/1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em">Arrancando Colmena…</strong><span style="font-size: 15px; color: #5C606C">Preparando tu equipo en este ordenador.</span></div>
<span aria-hidden="true" style="position: relative; width: 180px; height: 3px; border-radius: 2px; background: rgba(18,19,26,.08); overflow: hidden"><span style="position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px; background: #12131A; animation: sweep 1.4s ease-in-out infinite"></span></span>
</div>
</sc-if>
<sc-if value="{{boot.slow}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 40px; text-align: center; animation: fade .4s ease-out">
<img src="colmena-icon-128.png" alt="" width="64" height="64" style="display: block; width: 64px; height: 64px; opacity: .9">
<div style="display: flex; flex-direction: column; gap: 8px"><strong style="font: 600 24px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em">Colmena está tardando en arrancar</strong><span style="font-size: 15px; line-height: 1.5; color: #5C606C">Suele pasar justo después de encender el ordenador o si el antivirus está revisando la app. Tus datos están a salvo.</span></div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px"><button type="button" onClick="{{boot.retry}}" style="height: 46px; padding: 0 22px; border: 0; border-radius: 999px; background: #12131A; color: #FFFFFF; cursor: pointer; font-size: 15px; font-weight: 600">Reintentar</button><button type="button" style="height: 46px; padding: 0 18px; border: 0; border-radius: 999px; background: rgba(18,19,26,.06); cursor: pointer; font-size: 15px; font-weight: 600">Abrir el registro</button></div>
</div>
</sc-if>
</div>
<figcaption style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: #5C606C"><span><strong style="color: #12131A; font-weight: 600">Arranque.</strong> Si pasan 20 segundos, explica por qué y ofrece reintentar.</span><button type="button" onClick="{{boot.toggle}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: rgba(18,19,26,.06); cursor: pointer; font-size: 13px; font-weight: 600">{{boot.label}}</button></figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<div style="position: relative; height: 420px; border-radius: 22px; overflow: hidden; background: #F5F5F2; box-shadow: 0 30px 70px -36px rgba(18,19,26,.4), 0 0 0 1px rgba(18,19,26,.06); display: flex">
<div aria-hidden="true" style="width: 70px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 0; background: #EBEBE6; border-right: 1px solid rgba(18,19,26,.07)"><span style="display: flex; gap: 5px"><span style="width: 9px; height: 9px; border-radius: 50%; background: rgba(18,19,26,.14)"></span><span style="width: 9px; height: 9px; border-radius: 50%; background: rgba(18,19,26,.14)"></span><span style="width: 9px; height: 9px; border-radius: 50%; background: rgba(18,19,26,.14)"></span></span><img src="colmena-icon-128.png" alt="" width="28" height="28" style="display: block; width: 28px; height: 28px"><span style="width: 52px; height: 44px; border-radius: 12px; background: #FFFFFF"></span><span style="width: 40px; height: 8px; border-radius: 4px; background: rgba(18,19,26,.12)"></span><span style="width: 40px; height: 8px; border-radius: 4px; background: rgba(18,19,26,.12)"></span><span style="width: 40px; height: 8px; border-radius: 4px; background: rgba(18,19,26,.12)"></span></div>
<div aria-hidden="true" style="flex: 1; padding: 46px 34px; display: flex; flex-direction: column; gap: 18px; transition: opacity .4s ease, filter .4s ease; opacity: {{net.dim}}; filter: {{net.blur}}">
<span style="font: 600 40px/1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.04em">Buenos días.</span>
<span style="height: 64px; border-radius: 22px; background: #FFFFFF"></span>
<span style="height: 120px; border-radius: 22px; background: #FFFFFF"></span>
</div>
<div role="status" style="position: absolute; left: 50%; top: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; box-shadow: 0 16px 34px -16px rgba(18,19,26,.45); transition: background .3s ease, color .3s ease; animation: rise .35s ease-out; background: {{net.bg}}; color: {{net.fg}}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{net.dot}}; animation: {{net.anim}}"></span>{{net.text}}</div>
<sc-if value="{{net.off}}" hint-placeholder-val="{{ true }}"><p style="position: absolute; left: 104px; right: 34px; bottom: 26px; margin: 0; padding: 14px 18px; border-radius: 16px; background: rgba(255,255,255,.9); font-size: 14px; line-height: 1.45; color: #3D404A">Puedes seguir leyendo. Lo que escribas o apruebes se guarda y se envía en cuanto vuelva la conexión.</p></sc-if>
</div>
<figcaption style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: #5C606C"><span><strong style="color: #12131A; font-weight: 600">Sin conexión.</strong> Nada se bloquea; la píldora avisa y se va sola al volver.</span><button type="button" onClick="{{net.toggle}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: rgba(18,19,26,.06); cursor: pointer; font-size: 13px; font-weight: 600">{{net.label}}</button></figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<div style="position: relative; height: 420px; border-radius: 22px; overflow: hidden; background: #F5F5F2; box-shadow: 0 30px 70px -36px rgba(18,19,26,.4), 0 0 0 1px rgba(18,19,26,.06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 40px; text-align: center">
<span style="animation: drift 5s ease-in-out infinite"><span aria-hidden="true" style="display: inline-grid; flex: none; filter: drop-shadow(0 4px 8px rgba(18,19,26,.16))"><span style="display: block; width: 64px; height: 64px; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.62), rgba(255,255,255,0) 54%), #FFC93C; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); border-radius: 0"></span></span></span>
<div style="display: flex; flex-direction: column; gap: 8px"><strong style="font: 600 26px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em">Esta pantalla ya no está</strong><span style="font-size: 15px; line-height: 1.5; color: #5C606C">Puede que el encargo se haya cerrado o que alguien borrara la sala. No se ha perdido nada de lo tuyo.</span></div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px"><a href="V2Hoy.dc.html" style="display: flex; align-items: center; height: 46px; padding: 0 22px; border-radius: 999px; background: #12131A; color: #FFFFFF; font-size: 15px; font-weight: 600">Volver a Hoy</a><a href="V2Archivo.dc.html" style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; background: rgba(18,19,26,.06); font-size: 15px; font-weight: 600">Buscar en el Archivo</a></div>
</div>
<figcaption style="font-size: 14px; color: #5C606C"><strong style="color: #12131A; font-weight: 600">No encontrada.</strong> También vale para una solicitud que ya se resolvió o caducó.</figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<div style="position: relative; height: 420px; border-radius: 22px; overflow: hidden; background: #F5F5F2; box-shadow: 0 30px 70px -36px rgba(18,19,26,.4), 0 0 0 1px rgba(18,19,26,.06); display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 44px">
<span style="font-size: 13px; font-weight: 500; color: #6B6F7A">Mientras carga una lista</span>
<sc-for list="{{skeleton}}" as="k" hint-placeholder-count="4"><div aria-hidden="true" style="display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 20px; background: #FFFFFF"><span style="width: 36px; height: 36px; flex: none; border-radius: 12px; background: linear-gradient(90deg, #EFEFEA 0%, #F7F7F3 50%, #EFEFEA 100%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 8px"><span style="height: 12px; border-radius: 6px; background: linear-gradient(90deg, #EFEFEA 0%, #F7F7F3 50%, #EFEFEA 100%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; width: {{k.w1}}"></span><span style="height: 10px; border-radius: 5px; background: linear-gradient(90deg, #EFEFEA 0%, #F7F7F3 50%, #EFEFEA 100%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; width: {{k.w2}}"></span></span></div></sc-for>
</div>
<figcaption style="font-size: 14px; color: #5C606C"><strong style="color: #12131A; font-weight: 600">Cargando.</strong> Formas grises con un brillo suave, nunca un «Cargando…» suelto.</figcaption>
</figure>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1450}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slow: false, net: 'off' };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const s = this.state;
    const NET = {
      off: { text: 'Sin conexión con Colmena · reintentando…', bg: '#12131A', fg: '#FFFFFF', dot: '#FFC93C', anim: 'halo 1.6s ease-out infinite', dim: '.55', blur: 'grayscale(.4)', label: 'Simular que vuelve' },
      back: { text: 'Conectado de nuevo', bg: '#E1F4EC', fg: '#0B5A3E', dot: '#0B8A5F', anim: 'pop .4s ease-out', dim: '1', blur: 'none', label: 'Simular corte' }
    }[s.net];
    return {
      boot: { loading: !s.slow, slow: s.slow, label: s.slow ? 'Ver arrancando' : 'Ver si tarda', toggle: () => this.setState({ slow: !s.slow }), retry: () => { this.setState({ slow: false }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ slow: true }), 4000); } },
      net: { ...NET, off: s.net === 'off', toggle: () => this.setState({ net: s.net === 'off' ? 'back' : 'off' }) },
      skeleton: [['62%', '38%'], ['48%', '30%'], ['70%', '44%'], ['55%', '26%']].map(([w1, w2]) => ({ w1, w2 }))
    };
  }
}
</script>
</body>
</html>
