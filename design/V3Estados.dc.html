<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estados de la app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F5F2;font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:#12131A;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:#1F4FD1;text-decoration:none}a:hover{color:#12131A}
:focus-visible{outline:2px solid #1F4FD1;outline-offset:2px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F5F5F2; color: #12131A">
<main style="max-width: 1280px; margin: 0 auto; padding: 64px clamp(20px, 4vw, 56px) 96px; display: flex; flex-direction: column; gap: 40px">
<header style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 15px; font-weight: 500; color: #5C606C">Cuando algo no está listo</span>
<h1 style="margin: 0; font: 600 56px/1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.04em">Nunca una pantalla sin salida.</h1>
<p style="margin: 0; max-width: 680px; font-size: 17px; line-height: 1.5; color: #4A4D57">Cada estado dice qué pasa con palabras normales, tranquiliza sobre tus datos y ofrece el siguiente paso. En modo experto, además, el detalle técnico.</p>
</header>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 16px">

<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="height: 280px; display: grid; place-items: center; border-radius: 24px; background: #12131A; color: #FFFFFF">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center"><img src="/colmena-icon-128.png" alt="" width="56" height="56" style="display: block; width: 56px; height: 56px; animation: breathe 2.4s ease-in-out infinite"><span style="font: 600 24px/1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em">Arrancando Colmena…</span><span style="font-size: 14px; color: #C9CBD3">Despertando a tu equipo en este ordenador.</span></div>
</div>
<figcaption style="font-size: 14px; line-height: 1.45; color: #4A4D57"><strong style="color: #12131A">Arranque.</strong> El icono respira. Sin barras de progreso falsas.</figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="height: 280px; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 28px 32px; border-radius: 24px; background: #12131A; color: #FFFFFF">
<span style="font: 600 24px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em">Colmena está tardando en arrancar</span>
<span style="font-size: 14px; line-height: 1.5; color: #C9CBD3">Suele pasar justo después de encender el ordenador o si el antivirus revisa la app. Tus datos están a salvo.</span>
<div style="display: flex; gap: 10px; flex-wrap: wrap"><button type="button" style="height: 42px; padding: 0 18px; border: 0; border-radius: 999px; background: #FFFFFF; color: #12131A; font-size: 14px; font-weight: 600; cursor: pointer">Reintentar</button><button type="button" style="height: 42px; padding: 0 16px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; background: transparent; color: #FFFFFF; font-size: 14px; font-weight: 500; cursor: pointer">Abrir el registro</button></div>
</div>
<figcaption style="font-size: 14px; line-height: 1.45; color: #4A4D57"><strong style="color: #12131A">Tarda más de 20 s.</strong> Explica por qué y da dos salidas.</figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="position: relative; height: 280px; padding: 28px; border-radius: 24px; background: #FFFFFF; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 10px; opacity: .5"><span style="font: 600 30px/1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.03em">Buenos días.</span><span style="height: 12px; width: 70%; border-radius: 6px; background: #EEEEEA"></span><span style="height: 12px; width: 55%; border-radius: 6px; background: #EEEEEA"></span></div>
<div role="status" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-radius: 999px; background: #12131A; color: #FFFFFF; font-size: 14px; white-space: nowrap"><span aria-hidden="true" style="width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #FFFFFF; border-radius: 50%; animation: spin 1s linear infinite"></span>Sin conexión · reintentando…</div>
</div>
<figcaption style="font-size: 14px; line-height: 1.45; color: #4A4D57"><strong style="color: #12131A">Sin conexión con el servicio.</strong> Nada se bloquea: lo que escribas se guarda y se envía al volver.</figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="height: 280px; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 28px; border-radius: 24px; background: #FFFFFF">
<div style="display: flex; gap: 14px; padding: 18px; border-radius: 18px; background: #FFF6DC">
<span aria-hidden="true" style="flex: none; width: 26px; height: 26px; background: #12131A; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%)"></span>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15.5px; font-weight: 600">Tus bots no pueden pensar ahora</span><span style="font-size: 14px; line-height: 1.5; color: #4A4D57">La sesión de ChatGPT ha caducado. Vuelve a entrar y siguen donde lo dejaron.</span><a href="AjustesIA.dc.html" style="align-self: flex-start; height: 40px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 999px; background: #12131A; color: #FFFFFF; font-size: 14px; font-weight: 600">Volver a entrar</a></div>
</div>
</div>
<figcaption style="font-size: 14px; line-height: 1.45; color: #4A4D57"><strong style="color: #12131A">Sin cuenta de IA.</strong> Es lo único que «te necesita» a nivel de app: va en miel.</figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="height: 280px; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 28px; border-radius: 24px; background: #FFFFFF">
<span style="font-size: 15.5px; font-weight: 600">ChatGPT ha llegado a su límite de 5 horas</span>
<span style="font-size: 14px; line-height: 1.5; color: #4A4D57">Tus bots siguen con Claude, tu cuenta de respaldo, como pediste en Ajustes. ChatGPT vuelve a las 18:40.</span>
<div style="display: flex; flex-direction: column; gap: 6px"><span aria-hidden="true" style="height: 8px; border-radius: 4px; background: #12131A"></span><span style="display: flex; justify-content: space-between; font-size: 12.5px; color: #5C606C"><span>100 % usado</span><span>vuelve a las 18:40</span></span></div>
<div style="display: flex; gap: 10px; flex-wrap: wrap"><button type="button" style="height: 42px; padding: 0 16px; border: 1px solid rgba(18,19,26,.16); border-radius: 999px; background: #FFFFFF; font-size: 14px; font-weight: 500; cursor: pointer">Mejor esperar a ChatGPT</button><a href="AjustesIA.dc.html" style="height: 42px; padding: 0 12px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 500">Cambiar el respaldo</a></div>
</div>
<figcaption style="font-size: 14px; line-height: 1.45; color: #4A4D57"><strong style="color: #12131A">Límite del plan.</strong> Nada se para: cambia solo al respaldo, lo cuenta y dice cuándo vuelve.</figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px; border-radius: 24px; background: #FFFFFF; text-align: center">
<span aria-hidden="true" style="display: flex; gap: 6px"><span style="width: 18px; height: 18px; background: #E6E7EC; border-radius: 24%"></span><span style="width: 18px; height: 18px; background: #E6E7EC; border-radius: 50%"></span><span style="width: 18px; height: 18px; background: #E6E7EC; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></span></span>
<span style="font: 600 22px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em">Aún no hay tareas</span>
<span style="font-size: 14px; line-height: 1.5; color: #4A4D57; max-width: 320px">Cuando pidas algo que lleve más de un paso, aparecerá aquí con su plan y su avance.</span>
<a href="Inicio.dc.html" style="height: 42px; padding: 0 18px; display: inline-flex; align-items: center; border-radius: 999px; background: #12131A; color: #FFFFFF; font-size: 14px; font-weight: 600">Pedir algo</a>
</div>
<figcaption style="font-size: 14px; line-height: 1.45; color: #4A4D57"><strong style="color: #12131A">Vacío.</strong> Explica qué aparecerá ahí y cómo conseguirlo.</figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="height: 280px; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 28px; border-radius: 24px; background: #FFFFFF">
<span style="font: 600 26px/1.05 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em">Esta pantalla ya no está</span>
<span style="font-size: 14px; line-height: 1.5; color: #4A4D57">Puede que la tarea se cerrara o que alguien borrara la sala. No se ha perdido nada de lo tuyo.</span>
<div style="display: flex; gap: 10px; flex-wrap: wrap"><a href="Inicio.dc.html" style="height: 42px; padding: 0 18px; display: inline-flex; align-items: center; border-radius: 999px; background: #12131A; color: #FFFFFF; font-size: 14px; font-weight: 600">Volver a Inicio</a><a href="Buscar.dc.html" style="height: 42px; padding: 0 16px; display: inline-flex; align-items: center; border: 1px solid rgba(18,19,26,.16); border-radius: 999px; color: #12131A; font-size: 14px; font-weight: 500">Buscar</a></div>
</div>
<figcaption style="font-size: 14px; line-height: 1.45; color: #4A4D57"><strong style="color: #12131A">No encontrada.</strong> También para una aprobación que ya caducó.</figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="height: 280px; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 28px; border-radius: 24px; background: #FFFFFF">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div style="display: flex; align-items: center; gap: 12px"><span style="flex: none; width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(90deg,#ECECE7 0%,#F6F6F3 40%,#ECECE7 80%); background-size: 300% 100%; animation: shimmer 1.6s ease-in-out infinite"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 7px"><span style="height: 11px; width: {{r}}; border-radius: 6px; background: linear-gradient(90deg,#ECECE7 0%,#F6F6F3 40%,#ECECE7 80%); background-size: 300% 100%; animation: shimmer 1.6s ease-in-out infinite"></span><span style="height: 9px; width: 40%; border-radius: 6px; background: #F1F1EC"></span></span></div></sc-for>
</div>
<figcaption style="font-size: 14px; line-height: 1.45; color: #4A4D57"><strong style="color: #12131A">Cargando.</strong> Formas grises con un brillo suave; nunca un «Cargando…» suelto.</figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="height: 280px; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 28px; border-radius: 24px; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; box-shadow: inset 0 0 0 2.5px #B4232A"><span style="width: 20px; height: 20px; border-radius: 50%; background: #2F6BFF"></span></span><span style="font-size: 15.5px; font-weight: 600">Nora se ha atascado</span></div>
<span style="font-size: 14px; line-height: 1.5; color: #4A4D57">La web del INE no responde desde hace 10 min. Ha guardado lo que llevaba.</span>
<span style="padding: 10px 12px; border-radius: 12px; background: #F6F6F3; font: 400 12px/1.5 'Geist Mono', monospace; color: #3D404A">web_fetch ine.es/… → 503 · 3 reintentos · modo experto</span>
<div style="display: flex; gap: 10px; flex-wrap: wrap"><button type="button" style="height: 42px; padding: 0 18px; border: 0; border-radius: 999px; background: #12131A; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">Reintentar</button><a href="Chat.dc.html" style="height: 42px; padding: 0 16px; display: inline-flex; align-items: center; border: 1px solid rgba(18,19,26,.16); border-radius: 999px; color: #12131A; font-size: 14px; font-weight: 500">Hablar con Nora</a></div>
</div>
<figcaption style="font-size: 14px; line-height: 1.45; color: #4A4D57"><strong style="color: #12131A">Un bot atascado.</strong> Anillo rojo, motivo en frase y el detalle técnico solo en modo experto.</figcaption>
</figure>

<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<div style="position: relative; height: 280px; padding: 28px; border-radius: 24px; background: #FFFFFF; overflow: hidden">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px; opacity: .5"><span style="font: 600 30px/1 'Bricolage Grotesque', sans-serif; letter-spacing: -0.03em">Trabajo</span><span style="height: 12px; width: 64%; border-radius: 6px; background: #EEEEEA"></span><span style="height: 12px; width: 48%; border-radius: 6px; background: #EEEEEA"></span></div>
<div role="status" style="position: absolute; left: 24px; right: 24px; bottom: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 10px 10px 18px; border-radius: 18px; background: #12131A; color: #FFFFFF; font-size: 14px"><span style="flex: 1 1 180px">Hay una versión nueva de Colmena (3.2.0).</span><button type="button" style="height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: #FFFFFF; color: #12131A; font-size: 14px; font-weight: 600; cursor: pointer">Reiniciar y actualizar</button><button type="button" style="height: 38px; padding: 0 10px; border: 0; background: transparent; color: #C9CBD3; font-size: 14px; cursor: pointer">Luego</button></div>
</div>
<figcaption style="font-size: 14px; line-height: 1.45; color: #4A4D57"><strong style="color: #12131A">Actualización.</strong> Un aviso discreto, nunca un bloqueo. Al reiniciar, cada bot termina su paso y sigue después.</figcaption>
</figure>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() { return { rows: ['72%', '58%', '80%', '46%'] }; }
}
</script>
</body>
</html>
