# Colmena's mailbox on Cloudflare (see docs/PEOPLE.md › «Buzón en Cloudflare»).
# Deploy from this folder: npx wrangler@4.150.0 login, then npx wrangler@4.150.0 deploy
# Served at https://colmena.klast-lab-fa693a.workers.dev (the account's workers.dev subdomain).
name = "colmena"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "INVITE"
class_name = "Invite"

[[durable_objects.bindings]]
name = "BLOB"
class_name = "Blob"

# SQLite-backed Durable Objects (available on the Workers Free plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "Invite"]

# Sealed file parts (files shared in conversations), one object per file, 7 days.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Blob"]

[observability]
enabled = false
