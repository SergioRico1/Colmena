<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
<title>Colmena · Elige una zona</title>
<style>
  /* Colmena tokens: ink #12131A, honey #FFC93C, paper #FFFFFF. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12131A; cursor: crosshair; user-select: none; }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .hint { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #FFFFFF; color: #12131A; border: 2px solid #12131A; border-radius: 14px; box-shadow: 4px 4px 0 #FFC93C; font: 600 14px/1.2 "Geist", "Segoe UI", system-ui, sans-serif; pointer-events: none; animation: rise 160ms cubic-bezier(.2,.8,.2,1) both; }
  .hint kbd { font: 600 12px/1 "Geist Mono", Consolas, monospace; padding: 4px 6px; border: 1px solid #DCE0E8; border-radius: 6px; background: #F7F8FA; }
  .hint.gone { display: none; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, -6px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @media (prefers-reduced-motion: reduce) { .hint { animation: none; } }
</style>
</head>
<body>
<img id="shot" alt="" />
<canvas id="c"></canvas>
<div class="hint" id="hint" role="status">Arrastra para elegir la zona <kbd>Esc</kbd> cancela</div>
<script>
  // OpenClaw area picker: 35 % dim with a clear hole, a 1 px accent border and a «W × H»
  // badge 7 px above the selection (below it when there is no room), 4 px from the edges.
  const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");
  let start = null, rect = null, scale = 1;
  const fit = () => {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  };
  const draw = () => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.fillStyle = "rgba(18,19,26,.45)";
    ctx.beginPath();
    ctx.rect(0, 0, innerWidth, innerHeight);
    if (rect && rect.width > 0 && rect.height > 0) ctx.rect(rect.x, rect.y, rect.width, rect.height);
    ctx.fill("evenodd");
    if (!rect || rect.width <= 0 || rect.height <= 0) return;
    ctx.strokeStyle = "#FFC93C"; ctx.lineWidth = 2;
    ctx.strokeRect(rect.x + 1, rect.y + 1, rect.width - 2, rect.height - 2);
    const label = Math.round(rect.width * scale) + " × " + Math.round(rect.height * scale);
    ctx.font = "600 12px Consolas, 'Geist Mono', monospace";
    const w = ctx.measureText(label).width + 14, h = 22;
    let bx = Math.min(Math.max(4, rect.x), innerWidth - w - 4);
    let by = rect.y - h - 7;
    if (by < 4) by = Math.min(innerHeight - h - 4, rect.y + rect.height + 7);
    ctx.fillStyle = "#12131A";
    ctx.beginPath(); ctx.roundRect(bx, by, w, h, 6); ctx.fill();
    ctx.fillStyle = "#FFFFFF"; ctx.textBaseline = "middle";
    ctx.fillText(label, bx + 7, by + h / 2 + 1);
  };
  const box = (a, b) => ({ x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), width: Math.abs(a.x - b.x), height: Math.abs(a.y - b.y) });
  window.addEventListener("resize", fit);
  window.addEventListener("mousedown", (e) => { if (e.button !== 0) return; start = { x: e.clientX, y: e.clientY }; rect = null; hint.classList.add("gone"); draw(); });
  window.addEventListener("mousemove", (e) => { if (!start) return; rect = box(start, { x: e.clientX, y: e.clientY }); draw(); });
  window.addEventListener("mouseup", (e) => {
    if (!start) return;
    const r = box(start, { x: e.clientX, y: e.clientY });
    start = null;
    window.colmenaArea.done(r);
  });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") window.colmenaArea.cancel(); });
  window.addEventListener("contextmenu", (e) => { e.preventDefault(); window.colmenaArea.cancel(); });
  window.colmenaArea.onImage(({ image, scale: s }) => {
    scale = s || 1;
    document.getElementById("shot").src = image;
    fit();
  });
  fit();
</script>
</body>
</html>
