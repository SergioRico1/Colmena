# Lint, tests and a secret scan on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # the main platform: this leg decides
            experimental: false
          # The suite has only ever run on Windows. Until a green run on macOS confirms it,
          # this leg reports without failing the workflow; then set experimental to false.
          - os: macos-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/npm-ci
      - run: npm run lint
      - run: npm run check
      # Before the tests: the boot-time budget (tests/perf-budget.test.mjs) starts the
      # production server, which needs dist/, and is skipped without it.
      - run: npm run build
      - run: npm test

  # The macOS dictation helper compiles (both architectures) and answers its probe.
  dictation-mac:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sh server/dictation/macos/build.sh
      - run: server/dictation/bin/colmena-dictation --probe --lang es-ES

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
          # Change both together.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "$GITLEAKS_SHA256  $file" | sha256sum --check --strict
          tar -xzf "$file" gitleaks
          ./gitleaks git --redact --verbose .
